name = "pixput-license-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# D1: SQLite at the edge. Run `wrangler d1 create pixput-licenses`
# and paste the printed database_id below before first deploy.
[[d1_databases]]
binding = "DB"
database_name = "pixput-licenses"
database_id = "REPLACE_WITH_D1_ID"

# Production environment. Staging stanza added when needed.
[env.production]
name = "pixput-license-api"
routes = [
  # { pattern = "api.pixput.app/*", custom_domain = true },
]

# Secrets — set via `wrangler secret put NAME` (NOT committed):
#   ED25519_PRIVATE_KEY      (base64, generated by scripts/generate-keys.ts)
#   LEMONSQUEEZY_API_KEY     (from LS dashboard)
#   LEMONSQUEEZY_WEBHOOK_SECRET
